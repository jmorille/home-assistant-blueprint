blueprint:
  name: Aqara TRV E1 external temperature
  author: jmorille
  description: 'Drive Aqara E1 thermostatic radiator valves (Zigbee2MQTT) from an
    external temperature sensor and shut them off while a door or window is open.


    - The room temperature (min, max, average, first or last of the sensors) is sent
    to every available TRV, which is switched to its external sensor if needed.

    - A door/window must stay open for the configured delay before the TRVs are shut
    off. Heating resumes when every available contact is closed; unavailable contacts
    are ignored.

    - Before a shutoff, each TRV is snapshotted and restored afterwards (mode, preset,
    setpoint). A TRV switched off by hand stays off.

    - The window state is re-applied after a Zigbee2MQTT/Home Assistant outage, when
    the TRVs come back online, when a TRV starts heating while a window is open, on
    a manual run, and on every temperature update as a safety net.

    - A persistent notification reports a TRV that cannot be found (removed or re-paired
    device, missing entity).

    '
  domain: automation
  source_url: https://github.com/jmorille/home-assistant-blueprint/blob/main/z2m_aqara_trv_external_temperature.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    external_temp_sensor:
      name: External temperature sensors
      description: Room temperature sensors sent to the TRVs.
      selector:
        entity:
          multiple: true
          filter:
          - domain:
            - sensor
            device_class:
            - temperature
          reorder: false
    external_temp_comparator:
      name: Temperature comparator
      description: How the values of several sensors are combined.
      selector:
        select:
          options:
          - min
          - max
          - avg
          - first
          - last
          custom_value: false
          multiple: false
          sort: false
      default: avg
    external_contact_sensor:
      name: Door/window contact sensors
      description: Any contact open for the delay shuts the TRVs off; heating resumes
        when every available contact is closed (unavailable contacts are ignored).
      selector:
        entity:
          multiple: true
          filter:
          - domain:
            - binary_sensor
            device_class:
            - door
            - window
          reorder: false
    aqara_trv_shutoff:
      name: Shutoff method
      description: 'away: switch off and set the away preset (a TRV switched off by
        hand is never turned back on). close: switch off only.'
      selector:
        select:
          options:
          - away
          - close
          custom_value: false
          multiple: false
          sort: false
      default: away
    window_open_delay:
      name: Window open delay
      description: How long a door/window must stay open before the TRVs are shut
        off. Shorter openings are ignored.
      selector:
        duration: {}
      default:
        hours: 0
        minutes: 0
        seconds: 30
    aqara_trv_device:
      name: Aqara TRVs
      description: The Aqara E1 TRVs driven by this automation.
      selector:
        device:
          multiple: true
          filter:
          - integration: mqtt
            manufacturer: Xiaomi
            model: Aqara Smart Radiator Thermostat E1 (SRTS-A01)
# queued, not restart: a run that waits for devices after an outage must not be
# cancelled by the next temperature update. Runs are otherwise a few ms long.
mode: queued
max: 10
max_exceeded: silent
trigger_variables:
  trv_devices: !input aqara_trv_device
  trv_contacts: !input external_contact_sensor
variables:
  aqara_trv_device: !input aqara_trv_device
  external_temp_sensor: !input external_temp_sensor
  external_temp_comparator: !input external_temp_comparator
  external_contact_sensor: !input external_contact_sensor
  aqara_trv_shutoff: !input aqara_trv_shutoff
  window_open_delay: !input window_open_delay
  window_open_delay_s: '{{ (window_open_delay.days | default(0)) * 86400 + (window_open_delay.hours
    | default(0)) * 3600 + (window_open_delay.minutes | default(0)) * 60 + (window_open_delay.seconds
    | default(0)) }}'
triggers:
- trigger: state
  entity_id: !input external_temp_sensor
  to: null
  id: temp-change
- trigger: state
  entity_id: !input external_contact_sensor
  to: 'on'
  for: !input window_open_delay
  id: window-open
- trigger: state
  entity_id: !input external_contact_sensor
  to: 'off'
  id: window-close
- trigger: homeassistant
  event: start
  id: ha-start
- trigger: template
  value_template: "{% set c = trv_devices | map('device_entities') | sum(start=[])
    | select('match', 'climate\\.') | list %}{{ c | count > 0 and c | reject('is_state',
    ['unavailable', 'unknown']) | list | count == c | count }}"
  id: trv-back
- trigger: template
  value_template: "{% set c = trv_devices | map('device_entities') | sum(start=[])
    | select('match', 'climate\\.') | list %}{{ trv_contacts | select('is_state',
    'on') | list | count > 0 and c | select('is_state', 'heat') | list | count > 0
    }}"
  id: trv-heat-while-open
actions:
- alias: Detect a recovery (outage, HA start, TRVs back online)
  variables:
    trigger_id: '{{ trigger.id | default('''') }}'
    is_recovery: "{{ trigger_id in ['ha-start', 'trv-back'] or (trigger_id in ['window-open',
      'window-close'] and trigger.from_state is defined and trigger.from_state is
      not none and trigger.from_state.state in ['unavailable', 'unknown']) }}"
- alias: After an outage, let the contacts and TRVs come back before deciding
  if:
  - condition: template
    value_template: '{{ is_recovery }}'
  then:
  - delay:
      seconds: 10
- alias: Read the TRVs, sensors and contacts
  variables:
    trv_entities: '{{ aqara_trv_device | map(''device_entities'') | sum(start=[]) }}'
    aqara_trv_select_entity: '{{ trv_entities | select(''match'', ''select\.'') |
      expand | selectattr(''attributes.options'', ''defined'') | selectattr(''attributes.options'',
      ''contains'', ''external'') | map(attribute=''entity_id'') | list }}'
    aqara_trv_climate_entity: '{{ trv_entities | select(''match'', ''climate\.'')
      | list }}'
    aqara_trv_number_entity: "{% set ns = namespace(l=[]) %}{% for e in trv_entities
      | select('match', 'number\\.') %}{% if e is match('.*_external_temperature_input$')
      or (state_attr(e, 'device_class') == 'temperature' and state_attr(e, 'max')
      | float(0) == 55) %}{% set ns.l = ns.l + [e] %}{% endif %}{% endfor %}{{ ns.l
      }}"
    number_available: '{{ aqara_trv_number_entity | reject(''is_state'', ''unavailable'')
      | list }}'
    external_temp_list: '{{ expand(external_temp_sensor) | map(attribute=''state'')
      | select(''is_number'') | map(''float'') | list }}'
    aqara_compute_temperature: "{% set l = external_temp_list %}{% if l | count ==
      0 -%}\n  none\n{%- elif external_temp_comparator == 'min' -%}\n  {{ l | min
      }}\n{%- elif external_temp_comparator == 'max' -%}\n  {{ l | max }}\n{%- elif
      external_temp_comparator == 'first' -%}\n  {{ l | first }}\n{%- elif external_temp_comparator
      == 'last' -%}\n  {{ l | last }}\n{%- else -%}\n  {{ ((l | sum) / (l | count))
      | round(3) }}\n{%- endif %}"
    contact_available: '{{ external_contact_sensor | select(''is_state'', [''on'',
      ''off'']) | list }}'
    contact_open: '{{ contact_available | select(''is_state'', ''on'') | list }}'
    contact_open_long: "{% set ns = namespace(l=[]) %}{% for e in contact_open %}{%
      if trigger_id == 'ha-start' or (now() - states[e].last_changed).total_seconds()
      >= (window_open_delay_s | float(0)) - 1 %}{% set ns.l = ns.l + [e] %}{% endif
      %}{% endfor %}{{ ns.l }}"
    climate_available: '{{ aqara_trv_climate_entity | reject(''is_state'', [''unavailable'',
      ''unknown'']) | list }}'
    climate_to_off: '{{ climate_available | reject(''is_state'', ''off'') | list }}'
    climate_to_away: '{{ climate_to_off | reject(''is_state_attr'', ''preset_mode'',
      ''away'') | list }}'
    climate_to_resume: "{% set ns = namespace(l=[]) %}{% for c in climate_available
      | select('is_state', 'off') %}{% set has_scene = expand('scene.trv_restore_'
      ~ c.split('.')[1]) | count > 0 %}{% if aqara_trv_shutoff == 'away' %}{% if
      has_scene or is_state_attr(c, 'preset_mode', 'away') %}{% set ns.l = ns.l +
      [c] %}{% endif %}{% elif has_scene or (trigger_id == 'window-close' and not
      is_recovery) %}{% set ns.l = ns.l + [c] %}{% endif %}{% endfor %}{{ ns.l }}"
    config_problems: "{% set ns = namespace(l=[]) %}{% for d in aqara_trv_device
      %}{% set ents = device_entities(d) %}{% set c = ents | select('match', 'climate\\.')
      | list %}{% if device_attr(d, 'name') is none %}{% set ns.l = ns.l + ['device
      ' ~ d ~ ' not found (removed or re-paired?)'] %}{% elif c | count == 0 %}{%
      set ns.l = ns.l + [device_attr(d, 'name') ~ ': no climate entity'] %}{% elif
      not is_state(c[0], 'unavailable') and ents | select('in', aqara_trv_number_entity)
      | list | count == 0 %}{% set ns.l = ns.l + [device_attr(d, 'name') ~ ': external
      temperature entity not found'] %}{% endif %}{% endfor %}{{ ns.l }}"
    stale_scenes: "{% set ns = namespace(l=[]) %}{% if contact_open_long | count
      == 0 %}{% for c in climate_available | reject('is_state', 'off') %}{% set s
      = 'scene.trv_restore_' ~ c.split('.')[1] %}{% if expand(s) | count > 0 %}{%
      set ns.l = ns.l + [s] %}{% endif %}{% endfor %}{% endif %}{{ ns.l }}"
- alias: Report TRVs that cannot be found (not on temperature updates, to avoid
    re-creating a dismissed notification every few minutes)
  if:
  - condition: template
    value_template: '{{ trigger_id != ''temp-change'' and config_problems | count
      > 0 }}'
  then:
  - action: persistent_notification.create
    data:
      notification_id: '{{ ''trv_blueprint_'' ~ this.entity_id }}'
      title: '{{ this.attributes.friendly_name | default(this.entity_id) }}: TRV
        configuration'
      message: "Re-select the TRVs in the automation.\n{{ config_problems | join('\n')
        }}"
- alias: Forget snapshots of TRVs already heating again with no window open (resumed
    by hand or by the device), so a later manual switch-off is respected
  if:
  - condition: template
    value_template: '{{ stale_scenes | count > 0 }}'
  then:
  - action: scene.delete
    target:
      entity_id: '{{ stale_scenes }}'
- parallel:
  - alias: Send the room temperature to the available TRVs
    sequence:
    - if:
      - condition: template
        value_template: '{{ external_temp_list | count > 0 and number_available |
          count > 0 }}'
      then:
      - variables:
          aqara_trv_select_entity_internal: '{{ aqara_trv_select_entity | select(''is_state'',
            ''internal'') | list }}'
      - if:
        - condition: template
          value_template: '{{ aqara_trv_select_entity_internal | count > 0 }}'
        then:
        - action: select.select_option
          target:
            entity_id: '{{ aqara_trv_select_entity_internal }}'
          data:
            option: external
        - delay:
            seconds: 1
      - action: number.set_value
        data:
          value: '{{ aqara_compute_temperature | float | round(2) }}'
        target:
          entity_id: '{{ number_available }}'
  - alias: Apply the window state
    choose:
    # Applied on every trigger, temperature updates included (~every 15 min):
    # a safety net for TRVs that dropped out and came back.
    - alias: A contact has been open for the delay - snapshot and shut off
      conditions:
      - condition: template
        value_template: '{{ contact_open_long | count > 0 and climate_to_off | count
          > 0 }}'
      sequence:
      - alias: Snapshot each TRV (mode, preset, setpoint) to restore it later
        repeat:
          for_each: '{{ climate_to_off }}'
          sequence:
          - action: scene.create
            data:
              scene_id: '{{ ''trv_restore_'' ~ repeat.item.split(''.'')[1] }}'
              snapshot_entities:
              - '{{ repeat.item }}'
      - action: climate.turn_off
        target:
          entity_id: '{{ climate_to_off }}'
      - if:
        - condition: template
          value_template: '{{ aqara_trv_shutoff == ''away'' and climate_to_away |
            count > 0 }}'
        then:
        - action: climate.set_preset_mode
          target:
            entity_id: '{{ climate_to_away }}'
          data:
            preset_mode: away
    - alias: Every available contact is closed - restore the TRVs shut off for a window
        (only TRVs marked by a snapshot or the away preset)
      conditions:
      - condition: template
        value_template: '{{ contact_available | count > 0 and contact_open | count
          == 0 and climate_to_resume | count > 0 }}'
      sequence:
      - repeat:
          for_each: '{{ climate_to_resume }}'
          sequence:
          - variables:
              restore_scene: '{{ ''scene.trv_restore_'' ~ repeat.item.split(''.'')[1]
                }}'
          - if:
            - alias: Snapshot available (lost after a Home Assistant restart)
              condition: template
              value_template: '{{ expand(restore_scene) | count > 0 }}'
            then:
            - action: scene.turn_on
              target:
                entity_id: '{{ restore_scene }}'
            - action: scene.delete
              target:
                entity_id: '{{ restore_scene }}'
            else:
            - if:
              - condition: template
                value_template: '{{ aqara_trv_shutoff == ''away'' }}'
              then:
              - action: climate.set_preset_mode
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  preset_mode: manual
            - action: climate.turn_on
              target:
                entity_id: '{{ repeat.item }}'
